
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Business Assistant</title>
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --c-bg: var(--body-bg, #f3f6fa);
      --c-card: var(--card-bg, #fff);
      --c-text: var(--text-color, #172033);
      --c-muted: var(--muted-color, #737b8c);
      --c-border: var(--border-color, #dfe4ec);
      --c-accent: var(--accent-color, #166534);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; width: 100%;
      background: var(--c-bg) !important; color: var(--c-text);
      font-family: Arial, sans-serif; overflow-x: hidden;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app {
      min-height: 100vh; max-width: 900px; margin: auto;
      display: flex; flex-direction: column; background: var(--c-bg);
    }
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 12px 15px;
      background: var(--c-card); border-bottom: 1px solid var(--c-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon {
      display: grid; place-items: center; width: 42px; height: 42px;
      flex-shrink: 0; border-radius: 14px; background: var(--c-accent);
      color: white; font-size: 23px;
    }
    .brand h1 { margin: 0; font-size: 17px; }
    .brand p { margin: 4px 0 0; color: var(--c-muted); font-size: 11px; }
    .top-actions { display: flex; gap: 7px; }
    .top-btn {
      padding: 9px 11px; border: 1px solid var(--c-border);
      border-radius: 10px; background: var(--c-card); color: var(--c-text);
      font-size: 12px; font-weight: bold; text-decoration: none;
    }
    .top-btn.primary { background: var(--c-accent); color: white; border-color: var(--c-accent); }

    .chat-intro { padding: 17px 16px 9px; }
    .chat-intro h2 { margin: 0 0 5px; font-size: 19px; }
    .chat-intro p { margin: 0; color: var(--c-muted); font-size: 12px; line-height: 1.6; }

    .chat-area { padding: 12px 15px 22px; flex: 1; }
    #messages { display: flex; flex-direction: column; gap: 19px; }
    .welcome { display: none !important; }

    .message { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      display: grid; place-items: center; flex: 0 0 36px;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--c-accent); color: white; font-size: 17px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user .avatar { background: #dbeafe; color: #1d4ed8; }
    .message-body { max-width: min(88%, 690px); min-width: 0; }
    .message-name { margin: 3px 0 6px; color: var(--c-muted); font-size: 11px; font-weight: bold; }
    .user .message-name { text-align: right; }
    .bubble {
      color: var(--c-text); font-size: 14px; line-height: 1.8;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .user .bubble {
      padding: 10px 13px; border: 1px solid var(--c-border);
      border-radius: 15px 5px 15px 15px; background: var(--c-card);
    }
    .assistant .bubble { padding: 2px 0; }
    .message-tools { margin-top: 6px; }
    .small-btn { border: 0; background: transparent; color: var(--c-muted); font-size: 11px; padding: 5px 0; }

    .followup {
      margin-top: 13px; padding: 12px;
      border: 1px solid var(--c-border); border-radius: 13px;
      background: var(--c-card);
    }
    .followup-title {
      margin: 0 0 9px; color: var(--c-muted);
      font-size: 11px; font-weight: bold;
    }
    .followup-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 12px; border: 1px solid var(--c-border);
      border-radius: 22px; background: var(--c-bg);
      color: var(--c-text); font-size: 12px; font-weight: bold;
    }
    .choice:active { transform: scale(.97); }
    .choice.end { color: #b91c1c; }

    .typing { display: flex; gap: 5px; padding: 8px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--c-muted); animation: bounce .7s infinite alternate;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { to { opacity: .35; transform: translateY(-4px); } }

    .composer-wrap {
      position: sticky; bottom: 0; z-index: 4;
      padding: 11px 13px; border-top: 1px solid var(--c-border);
      background: var(--c-card);
    }
    .composer {
      display: flex; align-items: flex-end; gap: 9px;
      max-width: 800px; margin: auto; padding: 8px 9px 8px 13px;
      border: 1px solid var(--c-border); border-radius: 16px;
      background: var(--c-bg);
    }
    #questionInput {
      flex: 1; min-width: 0; min-height: 35px; max-height: 110px;
      resize: none; border: 0; outline: 0; background: transparent;
      color: var(--c-text); padding: 8px 0; font-size: 13px;
    }
    .send-btn {
      width: 39px; height: 39px; flex: 0 0 39px; border: 0;
      border-radius: 12px; background: var(--c-accent);
      color: white; font-size: 22px;
    }
    .composer-hint { text-align: center; margin: 7px 0 0; color: var(--c-muted); font-size: 10px; }
    #statusText { display: none; color: var(--c-muted); font-size: 11px; padding: 0 4px 8px; }
    #statusText.show { display: block; }
    .ended-note {
      padding: 17px; margin: 10px 0; text-align: center;
      border: 1px solid var(--c-border); border-radius: 13px;
      background: var(--c-card); color: var(--c-muted); font-size: 13px;
    }
    @media (max-width: 500px) {
      .topbar { padding: 10px; }
      .brand-icon { width: 37px; height: 37px; }
      .brand h1 { font-size: 14px; }
      .brand p { font-size: 10px; }
      .top-btn { padding: 8px; font-size: 10px; }
      .chat-area { padding: 10px 11px 18px; }
      .chat-intro { padding: 14px 12px 8px; }
      .avatar { width: 31px; height: 31px; flex-basis: 31px; }
      .message-body { max-width: calc(100% - 40px); }
      .bubble { font-size: 13px; }
      .choice { padding: 8px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">✦</div>
      <div>
        <h1>AI Business Assistant</h1>
        <p>Store help · Tap to explore</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="top-btn primary" id="newChatBtn" type="button">↻ Restart</button>
      <a class="top-btn" href="index.html">⌂ Home</a>
    </div>
  </header>

  <section class="chat-intro">
    <h2>Assistant Chat</h2>
    <p>Choose a topic in the conversation below. No need to type.</p>
  </section>

  <main class="chat-area" id="chatArea">
    <div id="messages">
      <section class="welcome" id="welcome"></section>
    </div>
  </main>

  <footer class="composer-wrap" id="composerWrap">
    <div id="statusText">Preparing answer…</div>
    <form class="composer" id="questionForm">
      <textarea id="questionInput" rows="1" maxlength="2000"
        placeholder="Or type your own question…" aria-label="Type a question"></textarea>
      <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">↑</button>
    </form>
    <p class="composer-hint">Tap an option above, or type a question.</p>
  </footer>
</div>

<script src="ai.js"></script>
<script>
(function () {
  "use strict";

  const messages = document.getElementById("messages");
  const form = document.getElementById("questionForm");
  const input = document.getElementById("questionInput");
  const newChatBtn = document.getElementById("newChatBtn");
  const composerWrap = document.getElementById("composerWrap");
  const chatArea = document.getElementById("chatArea");
  const historyKey = "gs_ai_chat_history";

  let ended = false;
  let lastAnsweredCount = 0;
  let chosenTopic = "";
  let observerLock = false;

  const topics = [
    { id: "stock", label: "📦 Low Stock", question: "अहिले कुन सामानको स्टक कम छ?" },
    { id: "due", label: "🧾 Customer Due", question: "कसकसको उधारो बाँकी छ?" },
    { id: "best", label: "🏆 Best Selling", question: "कुन सामान धेरै बिक्री भयो?" },
    { id: "customer", label: "👥 Customers", question: "ग्राहकको विवरण देखाउनुहोस्।" },
    { id: "supplier", label: "🚚 Suppliers", question: "सप्लायरको विवरण देखाउनुहोस्।" },
    { id: "sales", label: "💰 Sales", question: "आजको बिक्री कति भयो?" },
    { id: "purchase", label: "🛒 Purchases", question: "आजको खरिद कति भयो?" },
    { id: "expense", label: "💸 Expenses", question: "खर्चको विवरण देखाउनुहोस्।" },
    { id: "profit", label: "📈 Profit", question: "नाफा कसरी थाहा पाउने?" },
    { id: "summary", label: "📊 Store Summary", question: "मेरो पसलको छोटो रिपोर्ट दिनुहोस्।" }
  ];

  function scrollBottom() {
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }), 60);
  }

  function makeFollowups(excludeId) {
    const old = document.getElementById("liveFollowups");
    if (old) old.remove();
    if (ended) return;

    const box = document.createElement("section");
    box.className = "followup";
    box.id = "liveFollowups";

    const title = document.createElement("p");
    title.className = "followup-title";
    title.textContent = "WHAT WOULD YOU LIKE TO CHECK NEXT?";
    box.appendChild(title);

    const options = document.createElement("div");
    options.className = "followup-options";

    topics.filter(t => t.id !== excludeId).forEach(topic => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = topic.label;
      button.addEventListener("click", () => chooseTopic(topic));
      options.appendChild(button);
    });

    const endButton = document.createElement("button");
    endButton.type = "button";
    endButton.className = "choice end";
    endButton.textContent = "⏹ End Chat";
    endButton.addEventListener("click", endChat);
    options.appendChild(endButton);

    box.appendChild(options);
    messages.appendChild(box);
    scrollBottom();
  }

  function addUserPhoto() {
    messages.querySelectorAll(".message.user .avatar").forEach(avatar => {
      if (avatar.dataset.photoReady) return;
      avatar.dataset.photoReady = "1";
      avatar.textContent = "👤";
      avatar.title = "You";
      try {
        const settings = JSON.parse(localStorage.getItem("gs_settings") || "{}");
        const photo = settings.profilePhoto || settings.userPhoto || settings.avatar || settings.photo;
        if (typeof photo === "string" && photo.trim()) {
          const img = document.createElement("img");
          img.src = photo;
          img.alt = "Your profile";
          img.onerror = () => { img.remove(); avatar.textContent = "👤"; };
          avatar.textContent = "";
          avatar.appendChild(img);
        }
      } catch (_) {}
    });
  }

  function endChat() {
    ended = true;
    const old = document.getElementById("liveFollowups");
    if (old) old.remove();
    const note = document.createElement("div");
    note.className = "ended-note";
    note.textContent = "Chat ended. Tap “Restart” to begin a new conversation.";
    messages.appendChild(note);
    composerWrap.style.display = "none";
    scrollBottom();
  }

  function chooseTopic(topic) {
    if (ended) return;
    chosenTopic = topic.id;
    const old = document.getElementById("liveFollowups");
    if (old) old.remove();

    input.value = topic.question;
    form.requestSubmit();
  }

  // Listen for answers added by the existing ai.js.
  const observer = new MutationObserver(() => {
    if (observerLock || ended) return;
    addUserPhoto();

    const assistantMessages = messages.querySelectorAll(".message.assistant:not(#typingMessage)");
    const count = assistantMessages.length;
    if (count > lastAnsweredCount) {
      lastAnsweredCount = count;
      const selected = chosenTopic;
      chosenTopic = "";
      makeFollowups(selected);
    }
  });
  observer.observe(messages, { childList: true, subtree: true });

  // Keep the initial screen inside the chat: first greeting, then choices.
  window.addEventListener("load", () => {
    addUserPhoto();
    const existing = messages.querySelectorAll(".message.assistant:not(#typingMessage)").length;
    if (!existing) {
      chosenTopic = "";
      input.value = "नमस्कार";
      form.requestSubmit();
    } else {
      lastAnsweredCount = existing;
      makeFollowups("");
    }
  });

  // Remove any legacy static topic cards if an older copy of the page remains.
  document.querySelectorAll(".ai-options, .ai-section-title, .ai-welcome").forEach(el => el.remove());

  newChatBtn.addEventListener("click", () => {
    ended = false;
    chosenTopic = "";
    lastAnsweredCount = 0;
    composerWrap.style.display = "";
    const old = document.getElementById("liveFollowups");
    if (old) old.remove();
    messages.querySelectorAll(".message, .ended-note").forEach(el => el.remove());
    try { localStorage.removeItem(historyKey); } catch (_) {}
    input.value = "नमस्कार";
    form.requestSubmit();
  });

  // Stop old click handling from accidentally sending a duplicate topic.
  document.querySelectorAll("[data-question]").forEach(button => button.remove());
})();
</script>
</body>
</html>
