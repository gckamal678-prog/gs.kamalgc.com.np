
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant | General Store</title>
  <style>
    :root {
      --green: #166534;
      --green-dark: #14532d;
      --green-light: #dcfce7;
      --bg: #f5f7f5;
      --white: #ffffff;
      --text: #17221a;
      --muted: #6b756d;
      --border: #e3e9e4;
      --user: #e8f5e9;
      --shadow: 0 4px 20px rgba(20, 83, 45, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Noto Sans Devanagari",
        "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--white);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font-size: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .top-actions { display: flex; gap: 8px; }

    .top-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 11px;
      padding: 9px 12px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      white-space: nowrap;
    }

    .top-btn:hover { background: #f5f8f5; }
    .top-btn.new-chat {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 26px 20px 18px;
    }

    .messages {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .welcome {
      text-align: center;
      padding: 8vh 10px 20px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 17px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: var(--green-light);
      font-size: 32px;
    }

    .welcome h2 {
      font-size: clamp(23px, 4vw, 31px);
      margin: 0 0 10px;
      letter-spacing: -.5px;
    }

    .welcome p {
      margin: 0 auto;
      max-width: 470px;
      line-height: 1.8;
      color: var(--muted);
      font-size: 14px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 570px;
      margin: 25px auto 0;
      text-align: left;
    }

    .quick-btn {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      transition: .15s ease;
    }

    .quick-btn:hover {
      border-color: #86b99a;
      background: #f7fbf7;
      transform: translateY(-1px);
    }

    .quick-btn strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .quick-btn span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      animation: appear .18s ease;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 16px;
    }

    .assistant .avatar {
      background: var(--green);
      color: white;
    }

    .user .avatar {
      background: var(--green-light);
    }

    .message-body {
      min-width: 0;
      max-width: calc(100% - 45px);
    }

    .message-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: 2px 0 7px;
    }

    .user .message-name { text-align: right; }

    .bubble {
      font-size: 14px;
      line-height: 1.9;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: var(--user);
      padding: 11px 15px;
      border-radius: 17px 5px 17px 17px;
    }

    .assistant .bubble { padding: 0 2px; }

    .bubble strong { color: var(--green-dark); }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 9px 2px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7a9680;
      animation: bounce .9s infinite alternate;
    }

    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      from { opacity: .35; transform: translateY(0); }
      to { opacity: 1; transform: translateY(-4px); }
    }

    .composer-wrap {
      padding: 12px 20px 10px;
      background: white;
      border-top: 1px solid var(--border);
    }

    .composer {
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid #d5dfd6;
      border-radius: 19px;
      padding: 9px 10px 9px 16px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color .15s;
    }

    .composer:focus-within {
      border-color: #6da47c;
      box-shadow: 0 0 0 3px rgba(22,101,52,.07);
    }

    #questionInput {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      resize: none;
      max-height: 160px;
      min-height: 29px;
      padding: 5px 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.7;
    }

    #questionInput::placeholder { color: #89928b; }

    .send-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 0;
      border-radius: 13px;
      background: var(--green);
      color: white;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: .15s;
    }

    .send-btn:hover { background: var(--green-dark); }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }

    .hint {
      text-align: center;
      color: #8b948d;
      font-size: 11px;
      margin: 8px 0 0;
    }

    .status {
      display: none;
      max-width: 760px;
      margin: 0 auto 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .status.show { display: block; }

    .message-tools {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .small-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 0;
    }

    .small-btn:hover { color: var(--green); }

    @media (max-width: 600px) {
      .topbar { min-height: 60px; padding: 10px 12px; }
      .brand-icon { width: 37px; height: 37px; border-radius: 12px; }
      .brand h1 { font-size: 15px; }
      .brand p { font-size: 11px; }
      .top-btn { padding: 9px; font-size: 12px; }
      .top-btn .btn-text { display: none; }
      .chat-area { padding: 18px 13px 15px; }
      .welcome { padding-top: 5vh; }
      .welcome-icon { width: 56px; height: 56px; }
      .quick-grid { gap: 8px; margin-top: 21px; }
      .quick-btn { padding: 11px; border-radius: 12px; }
      .quick-btn strong { font-size: 12px; }
      .quick-btn span { font-size: 11px; }
      .message { gap: 8px; }
      .avatar { width: 30px; height: 30px; flex-basis: 30px; }
      .message-body { max-width: calc(100% - 38px); }
      .bubble { font-size: 13px; }
      .composer-wrap { padding: 10px 11px 8px; }
      .composer { border-radius: 17px; padding-left: 13px; }
      .hint { font-size: 10px; }
    }

    @media (max-width: 360px) {
      .quick-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <h1>AI Assistant</h1>
          <p>General Store · पसलको सहायक</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="top-btn new-chat" id="newChatBtn" type="button">
          <span>＋</span><span class="btn-text">नयाँ च्याट</span>
        </button>
        <a class="top-btn" href="index.html" title="Dashboard">
          <span>⌂</span><span class="btn-text">Dashboard</span>
        </a>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="messages" id="messages">
        <section class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h2>नमस्कार! 👋</h2>
          <p>
            तपाईंको पसलको स्टक, बिक्री, उधारो र हिसाबबारे सोध्नुहोस्।
            म उपलब्ध पसलको डाटाका आधारमा सहयोग गर्नेछु।
          </p>

          <div class="quick-grid">
            <button class="quick-btn" type="button" data-question="अहिले कुन सामानको स्टक कम छ?">
              <strong>📦 स्टक जाँच</strong>
              <span>कम स्टक भएका सामान पत्ता लगाउनुहोस्</span>
            </button>
            <button class="quick-btn" type="button" data-question="आजको बिक्री कति भयो?">
              <strong>💰 बिक्री विवरण</strong>
              <span>बिक्रीको उपलब्ध विवरण हेर्नुहोस्</span>
            </button>
            <button class="quick-btn" type="button" data-question="कसकसको उधारो बाँकी छ?">
              <strong>🧾 उधारो जाँच</strong>
              <span>ग्राहकको बाँकी रकमबारे जानकारी</span>
            </button>
            <button class="quick-btn" type="button" data-question="मेरो पसलको छोटो रिपोर्ट दिनुहोस्।">
              <strong>📊 पसलको रिपोर्ट</strong>
              <span>सामान, ग्राहक, बिक्री र सप्लायर</span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <footer class="composer-wrap">
      <div class="status" id="statusText">उत्तर तयार हुँदैछ...</div>
      <form class="composer" id="questionForm">
        <textarea
          id="questionInput"
          rows="1"
          maxlength="2000"
          placeholder="यहाँ आफ्नो प्रश्न लेख्नुहोस्..."
          aria-label="आफ्नो प्रश्न लेख्नुहोस्"
          required
        ></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="प्रश्न पठाउनुहोस्">↑</button>
      </form>
      <p class="hint">Enter = पठाउनुहोस् · Shift + Enter = नयाँ लाइन</p>
    </footer>
  </div>

  <script src="ai.js"></script>
</body>
</html>
