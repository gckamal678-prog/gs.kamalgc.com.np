<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b35">
  <meta name="description" content="General Store Management System">
  <title>General Store Management - Dashboard</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./gs192.png">
  <link rel="apple-touch-icon" href="./gs192.png">
  <link rel="stylesheet" href="./style.css?v=20261011-4">
  <script src="./appearance.js></script>

  <style>
    :root {
      --gs-bg: #111827;
      --gs-panel: #1e293b;
      --gs-input: #0f172a;
      --gs-border: #334155;
      --gs-text: var(--text-color, #f8fafc);
      --gs-muted: var(--muted-color, #94a3b8);
      --gs-pink: var(--accent-color, #166534);
      --gs-sidebar-width: 370px;
      --gs-shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --gs-shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4);
      --gs-shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--gs-bg);
      color: var(--gs-text);
      font-family: var(--font-family, 'Segoe UI', system-ui, -apple-system, sans-serif);
      min-height: 100vh;
    }

    body.gs-app-locked { overflow: hidden; }

    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .gs-topbar {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gs-border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .gs-topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .gs-menu-toggle {
      border: 0;
      background: rgba(255, 255, 255, 0.05);
      color: var(--gs-text);
      font-size: 24px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      flex-shrink: 0;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .gs-menu-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.05);
    }

    .gs-topbar-title { min-width: 0; }

    .gs-topbar-title h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .gs-topbar-title p {
      margin: 3px 0 0;
      color: var(--gs-muted);
      font-size: 13px;
    }

    .gs-topbar-avatar {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      font-size: 20px;
      font-weight: 800;
      pointer-events: none;
      user-select: none;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: var(--gs-shadow-sm);
    }

    .gs-topbar-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      pointer-events: none;
    }

    .gs-layout {
      min-height: calc(100vh - 88px);
    }

    .gs-sidebar {
      position: fixed;
      top: 88px;
      left: 0;
      bottom: 0;
      z-index: 1500;
      width: var(--gs-sidebar-width);
      padding: 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #0f172a;
      border-right: 1px solid var(--gs-border);
      transform: translateX(0);
      transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gs-sidebar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 2px 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--gs-border);
    }

    .gs-sidebar-brand img {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      object-fit: contain;
      border-radius: 14px;
    }

    .gs-sidebar-brand strong {
      display: block;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    .gs-sidebar-brand small {
      display: block;
      color: var(--gs-muted);
      margin-top: 4px;
      font-size: 12px;
    }

    .gs-profile-card {
      padding: 18px;
      border: 1px solid var(--gs-border);
      border-radius: 18px;
      background: var(--gs-panel);
      box-shadow: var(--gs-shadow-sm);
    }

    .gs-profile-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .gs-profile-intro {
      margin: 0 0 16px;
      color: var(--gs-muted);
      line-height: 1.5;
      font-size: 13px;
    }

    .gs-profile-preview {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .gs-profile-photo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: #0f172a;
      color: white;
      font-size: 20px;
      font-weight: 800;
      border: 2px solid var(--gs-border);
    }

    .gs-profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gs-profile-preview strong,
    .gs-profile-preview small {
      display: block;
      overflow-wrap: anywhere;
    }

    .gs-profile-preview strong { font-size: 15px; font-weight: 700; }

    .gs-profile-preview small {
      color: var(--gs-muted);
      margin-top: 4px;
    }

    .gs-profile-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .gs-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .gs-field label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #cbd5e1;
    }

    .gs-field input,
    .gs-field select,
    .gs-field textarea {
      width: 100%;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid var(--gs-border);
      border-radius: 10px;
      background: var(--gs-input);
      color: var(--gs-text);
      outline-offset: 2px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .gs-field input:focus,
    .gs-field select:focus,
    .gs-field textarea:focus {
      outline: none;
      border-color: var(--gs-pink);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.25);
    }

    .gs-field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .gs-field small {
      color: var(--gs-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .gs-profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .gs-button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    .gs-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: var(--gs-shadow-sm);
    }

    .gs-button:active {
      transform: translateY(0);
    }

    .gs-save {
      background: var(--gs-pink);
      color: white;
      flex: 1;
    }

    .gs-remove {
      background: #7f1d1d;
      color: white;
    }

    .gs-profile-status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #14532d;
      color: #dcfce7;
      line-height: 1.5;
      overflow-wrap: anywhere;
      font-size: 13px;
      border: 1px solid #22c55e;
    }

    .gs-profile-status.error {
      background: #7f1d1d;
      color: #fee2e2;
      border-color: #ef4444;
    }

    .gs-sidebar-overlay {
      display: none;
      position: fixed;
      inset: 88px 0 0;
      z-index: 1400;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
    }

    .gs-main {
      margin-left: var(--gs-sidebar-width);
      min-width: 0;
      padding: 28px;
    }

    .gs-welcome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }

    .gs-welcome h2 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }

    .gs-welcome p {
      color: var(--gs-muted);
      margin: 0;
      line-height: 1.5;
    }

    .gs-primary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--gs-pink);
      color: white;
      text-decoration: none;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: var(--gs-shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .gs-primary-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--gs-shadow-md);
      filter: brightness(1.1);
    }

    .gs-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .gs-finance-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .gs-stat-card,
    .gs-finance-card,
    .gs-dashboard-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--gs-border);
      border-radius: 18px;
      background: var(--gs-panel);
      box-shadow: var(--gs-shadow-sm);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
    }

    .gs-stat-card:hover,
    .gs-finance-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--gs-shadow-md);
      border-color: #475569;
    }

    .gs-stat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gs-stat-icon,
    .gs-finance-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 22px;
    }

    .gs-stat-label { color: var(--gs-muted); font-size: 13px; font-weight: 600; }

    .gs-stat-value {
      margin-top: 14px;
      font-size: clamp(20px, 2.2vw, 28px);
      font-weight: 800;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }

    .gs-stat-bottom {
      margin-top: 12px;
      color: var(--gs-muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .gs-positive { color: #4ade80; font-weight: 700; }

    .gs-section-heading { margin: 32px 0 16px; }

    .gs-section-heading h3 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
    }

    .gs-section-heading p {
      margin: 0;
      color: var(--gs-muted);
      font-size: 14px;
    }

    .gs-finance-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .gs-finance-card > div:last-child { min-width: 0; }

    .gs-finance-card span,
    .gs-finance-card strong,
    .gs-finance-card small { display: block; }

    .gs-finance-card span { color: var(--gs-muted); font-size: 13px; font-weight: 600; }

    .gs-finance-card small { color: var(--gs-muted); font-size: 12px; margin-top: 2px; }

    .gs-finance-card strong {
      margin: 6px 0 2px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }

    .gs-dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: 20px;
    }

    .gs-card-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .gs-card-heading h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
    .gs-card-heading p { margin: 0; color: var(--gs-muted); font-size: 13px; }

    #salesPeriod {
      padding: 8px 12px;
      border: 1px solid var(--gs-border);
      border-radius: 10px;
      background: var(--gs-input);
      color: var(--gs-text);
      outline: none;
      cursor: pointer;
    }

    .gs-chart-area { min-height: 180px; overflow-x: auto; }
    .gs-attention-list { display: grid; gap: 12px; }

    .gs-attention-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.2s ease;
    }

    .gs-attention-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .gs-attention-text { flex: 1; min-width: 0; }
    .gs-attention-text strong { display: block; font-size: 14px; }
    .gs-attention-text span { display: block; margin-top: 2px; color: var(--gs-muted); font-size: 12px; }

    .gs-attention-item a,
    .gs-text-link {
      color: #f472b6;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      transition: color 0.2s ease;
    }

    .gs-attention-item a:hover,
    .gs-text-link:hover {
      color: #ec4899;
      text-decoration: underline;
    }

    .gs-table-wrap { width: 100%; overflow-x: auto; }

    .gs-quick-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .gs-quick-action {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--gs-border);
      border-radius: 14px;
      background: var(--gs-panel);
      color: var(--gs-text);
      text-decoration: none;
      overflow-wrap: anywhere;
      box-shadow: var(--gs-shadow-sm);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease, background 0.2s ease;
    }

    .gs-quick-action:hover {
      transform: translateY(-3px);
      box-shadow: var(--gs-shadow-md);
      border-color: #64748b;
      background: #26334d;
    }

    .gs-quick-action span { font-size: 26px; }
    .gs-quick-action strong { font-size: 15px; }
    .gs-quick-action small { color: var(--gs-muted); font-size: 12px; }

    /* =========================================================
       PREMIUM AI CARD DESIGN (Glow, Gradient, Modern Border)
       ========================================================= */
    .gs-ai-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 24px;
      padding: 24px 28px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #111827 100%);
      border: 1px solid rgba(236, 72, 153, 0.3);
      box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .gs-ai-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, transparent 60%);
      pointer-events: none;
      animation: aiGlow 8s infinite alternate ease-in-out;
    }

    @keyframes aiGlow {
      0% { transform: translate(-10%, -10%); }
      100% { transform: translate(10%, 10%); }
    }

    .gs-ai-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(168, 85, 247, 0.45);
      border-color: rgba(236, 72, 153, 0.6);
    }

    .gs-ai-card h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gs-ai-card p {
      color: #cbd5e1 !important;
      margin-top: 6px !important;
      font-size: 14px;
    }

    .gs-ai-card .gs-text-link {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: white !important;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .gs-ai-card .gs-text-link:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
      filter: brightness(1.1);
      text-decoration: none;
    }

    .gs-footer {
      margin-top: 32px;
      padding: 20px 0;
      color: var(--gs-muted);
      font-size: 13px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .gs-bottom-nav {
      position: fixed;
      z-index: 1200;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 3px;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--gs-border);
    }

    .gs-bottom-nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      min-height: 48px;
      color: var(--gs-muted);
      text-decoration: none;
      font-size: 11px;
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .gs-bottom-nav .gs-nav-icon { font-size: 20px; }

    .gs-bottom-nav a.active {
      color: #f472b6;
      font-weight: 800;
    }

    .gs-menu-dialog {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(6px);
    }

    .gs-menu-dialog.open { display: flex; }

    .gs-menu-box {
      width: min(620px, 100%);
      max-height: 85dvh;
      overflow-y: auto;
      padding: 22px;
      border: 1px solid var(--gs-border);
      border-radius: 20px;
      background: var(--gs-panel);
      box-shadow: var(--gs-shadow-lg);
    }

    .gs-menu-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .gs-menu-heading h2 { margin: 0; font-size: 20px; }

    .gs-menu-close {
      border: 0;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .gs-menu-close:hover { background: rgba(255, 255, 255, 0.2); }

    .gs-menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gs-menu-grid a {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 12px 16px;
      border: 1px solid var(--gs-border);
      border-radius: 12px;
      color: var(--gs-text);
      text-decoration: none;
      overflow-wrap: anywhere;
      font-weight: 600;
      background: rgba(255,255,255,0.02);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .gs-menu-grid a:hover {
      background: rgba(255,255,255,0.06);
      border-color: #64748b;
      transform: translateY(-2px);
    }

    .gs-startup {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: #071b35;
      color: white;
    }

    .gs-startup-card {
      width: min(390px, 100%);
      text-align: center;
    }

    .gs-startup-logo {
      display: block;
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto 20px;
      border-radius: 24px;

  <script>
    "use strict";

    /* सामान्य error देखाउने */
    window.addEventListener("error", function (event) {
      const box = document.getElementById("dashboardError");
      if (!box) return;
      box.style.display = "block";
      box.textContent = "JavaScript त्रुटि: " +
        (event.message || "अज्ञात त्रुटि");
    });

    /* Sidebar toggle */
    (function () {
      const button = document.getElementById("gsSidebarToggle");
      const overlay = document.getElementById("gsSidebarOverlay");

      function closeSidebar() {
        document.body.classList.remove("gs-sidebar-open");
        button.setAttribute("aria-expanded", "false");
      }

      button.addEventListener("click", function () {
        const open = document.body.classList.toggle("gs-sidebar-open");
        button.setAttribute("aria-expanded", String(open));
      });

      overlay.addEventListener("click", closeSidebar);

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeSidebar();
      });
    })();

    /* Store Profile र Dashboard Avatar */
    (function () {
      const KEY = "gs_settings";
      const $ = id => document.getElementById(id);
      const form = $("gsStoreProfileForm");
      const status = $("gsProfileStatus");
      const photoInput = $("gsOperatorPhoto");

      const fields = {
        storeName: $("gsStoreName"),
        ownerName: $("gsOwnerName"),
        storePhone: $("gsStorePhone"),
        storeEmail: $("gsStoreEmail"),
        taxType: $("gsTaxType"),
        taxNumber: $("gsTaxNumber"),
        storeAddress: $("gsStoreAddress"),
        invoiceFooter: $("gsInvoiceFooter")
      };

      let currentPhoto = "";

      function readSettings() {
        try {
          const raw = localStorage.getItem(KEY);
          const data = raw ? JSON.parse(raw) : {};
          return data && typeof data === "object" && !Array.isArray(data)
            ? data : {};
        } catch (error) {
          console.error("Settings पढ्न सकिएन:", error);
          return {};
        }
      }

      function initials(name) {
        const value = String(name || "GS").trim();
        return value ? value.slice(0, 1).toUpperCase() : "GS";
      }

      function renderPhoto(element, photo, name) {
        element.replaceChildren();

        if (!photo) {
          element.textContent = initials(name);
          return;
        }

        const img = document.createElement("img");
        img.src = photo;
        img.alt = "Store profile photo";
        img.draggable = false;

        img.onerror = function () {
          element.replaceChildren();
          element.textContent = initials(name);
        };

        element.appendChild(img);
      }

      function updateProfileDisplay(settings) {
        const name = settings.storeName || "Krishna G.C.";
        const owner = settings.ownerName || "Management System";
        const photo = settings.operatorPhoto || "";

        $("gsSidebarStoreTitle").textContent = name;
        $("gsProfilePreviewName").textContent = name;
        $("gsProfilePreviewOwner").textContent = owner;
        document.title = name + " - Dashboard";

        renderPhoto($("gsProfilePhotoPreview"), photo, name);
        renderPhoto($("gsDashboardAvatar"), photo, name);
      }

      function showStatus(message, error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
        status.style.display = "block";
      }

      function loadProfile() {
        const settings = readSettings();

        Object.keys(fields).forEach(function (key) {
          fields[key].value = settings[key] || "";
        });

        currentPhoto = settings.operatorPhoto || "";
        photoInput.value = "";
        updateProfileDisplay(settings);
      }

      photoInput.addEventListener("change", function () {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;

        if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
          photoInput.value = "";
          showStatus("PNG, JPG वा WebP फोटो मात्र छान्नुहोस्।", true);
          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          photoInput.value = "";
          showStatus("फोटो 2 MB भन्दा सानो हुनुपर्छ।", true);
          return;
        }

        const reader = new FileReader();

        reader.onload = function () {
          currentPhoto = String(reader.result || "");
          const settings = readSettings();
          settings.operatorPhoto = currentPhoto;
          updateProfileDisplay(settings);
          showStatus("फोटो preview तयार भयो। सुरक्षित गर्न Save Profile थिच्नुहोस्।");
        };

        reader.onerror = function () {
          showStatus("फोटो पढ्न सकिएन। फेरि प्रयास गर्नुहोस्।", true);
        };

        reader.readAsDataURL(file);
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!fields.storeName.value.trim()) {
          showStatus("Store Name अनिवार्य छ।", true);
          fields.storeName.focus();
          return;
        }

        const settings = readSettings();

        Object.keys(fields).forEach(function (key) {
          settings[key] = fields[key].value.trim();
        });

        settings.operatorPhoto = currentPhoto;

        try {
          localStorage.setItem(KEY, JSON.stringify(settings));
          updateProfileDisplay(settings);
          showStatus("Store Profile सुरक्षित भयो।");

          window.dispatchEvent(new CustomEvent("gs:settings-updated", {
            detail: { settings: settings }
          }));
        } catch (error) {
          console.error("Profile सुरक्षित गर्न सकिएन:", error);
          showStatus(
            "Profile सुरक्षित भएन। फोटोको आकार घटाएर पुनः प्रयास गर्नुहोस्।",
            true
          );
        }
      });

      $("gsRemoveAvatar").addEventListener("click", function () {
        currentPhoto = "";
        photoInput.value = "";

        const settings = readSettings();
        settings.operatorPhoto = "";

        updateProfileDisplay(settings);
        showStatus("फोटो हटाइयो। परिवर्तन स्थायी बनाउन Save Profile थिच्नुहोस्।");
      });

      window.addEventListener("storage", function (event) {
        if (event.key === KEY) loadProfile();
      });

      window.addEventListener("gs:settings-updated", function (event) {
        if (event.detail && event.detail.settings) {
          currentPhoto = event.detail.settings.operatorPhoto || "";
          updateProfileDisplay(event.detail.settings);
        }
      });

      loadProfile();
    })();

    /* Footer Overview */
    (function () {
      const dialog = document.getElementById("gsMenuDialog");
      const close = document.getElementById("gsMenuClose");
      const overview = document.getElementById("gsOverviewNav");
      const menuLinks = dialog.querySelectorAll(".gs-menu-grid a");

      function openDialog() {
        dialog.classList.add("open");
        document.body.style.overflow = "hidden";
        close.focus();
      }

      function closeDialog() {
        dialog.classList.remove("open");
        document.body.style.overflow = "";
      }

      overview.addEventListener("click", function (event) {
        event.preventDefault();
        openDialog();
      });

      close.addEventListener("click", closeDialog);

      dialog.addEventListener("click", function (event) {
        if (event.target === dialog) closeDialog();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && dialog.classList.contains("open")) {
          closeDialog();
          overview.focus();
        }
      });

      menuLinks.forEach(function (link) {
        link.addEventListener("click", function () {
          closeDialog();
        });
      });
    })();

    /* Splash -> MPIN -> Dashboard */
    (function () {
      const MPIN_KEY = "gs_mpin_security";
      const splash = document.getElementById("gsStartup");
      const progress = document.getElementById("gsStartupProgress");
      const form = document.getElementById("gsPinForm");
      const input = document.getElementById("gsPinInput");
      const confirmWrap = document.getElementById("gsPinConfirmWrap");
      const confirmInput = document.getElementById("gsPinConfirm");
      const errorText = document.getElementById("gsPinError");

      let mode = "unlock";
      let lockedUntil = 0;
      let failures = 0;

      function readConfig() {
        try {
          const raw = localStorage.getItem(MPIN_KEY);
          const data = raw ? JSON.parse(raw) : null;
          return data && typeof data === "object" ? data : null;
        } catch (error) {
          console.error("MPIN config पढ्न सकिएन:", error);
          return null;
        }
      }

      function validPin(pin) {
        return /^[0-9]{4,8}$/.test(pin);
      }

      async function hashPin(pin, salt) {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error(
            "Secure Crypto उपलब्ध छैन। HTTPS प्रयोग गर्नुहोस्।"
          );
        }

        const data = new TextEncoder().encode(salt + ":" + pin);
        const digest = await window.crypto.subtle.digest("SHA-256", data);

        return Array.from(new Uint8Array(digest))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      function makeSalt() {
        if (!window.crypto || !window.crypto.getRandomValues) {
          throw new Error("Secure random generator उपलब्ध छैन।");
        }

        const bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);

        return Array.from(bytes)
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("");
      }

      async function verifyPin(pin, config) {
        if (!config || !config.enabled || !config.hash || !config.salt) {
          return false;
        }

        const candidate = await hashPin(pin, config.salt);
        if (candidate.length !== config.hash.length) return false;

        let diff = 0;
        for (let i = 0; i < candidate.length; i++) {
          diff |= candidate.charCodeAt(i) ^ config.hash.charCodeAt(i);
        }

        return diff === 0;
      }

      function showPinScreen(firstTime) {
        mode = firstTime ? "setup" : "unlock";

        document.getElementById("gsStartupTitle").textContent =
          firstTime ? "पहिलो पटकको सेटअप" : "Krishna G.C.";

        document.getElementById("gsStartupMessage").textContent =
          firstTime
            ? "आफ्नो नयाँ MPIN बनाउनुहोस्।"
            : "Dashboard खोल्न MPIN राख्नुहोस्।";

        document.getElementById("gsPinTitle").textContent =
          firstTime ? "🔐 नयाँ MPIN बनाउनुहोस्" : "🔐 MPIN खोल्नुहोस्";

        document.getElementById("gsPinDescription").textContent =
          firstTime
            ? "४ देखि ८ अंकको नम्बर राखेर पुष्टि गर्नुहोस्।"
            : "आफूले सेट गरेको ४–८ अंकको MPIN राख्नुहोस्।";

        document.getElementById("gsPinSubmit").textContent =
          firstTime ? "MPIN सुरक्षित गर्नुहोस्" : "Dashboard खोल्नुहोस्";

        confirmWrap.style.display = firstTime ? "block" : "none";
        confirmInput.required = firstTime;
        input.autocomplete = firstTime ? "new-password" : "current-password";

        progress.style.display = "none";
        form.style.display = "block";
        input.value = "";
        confirmInput.value = "";
        errorText.textContent = "";

        setTimeout(function () { input.focus(); }, 50);
      }

      function enterDashboard() {
        splash.style.display = "none";
        document.body.classList.remove("gs-app-locked");
      }

      async function initializeGate() {
        const settings = (function () {
          try {
            return JSON.parse(localStorage.getItem("gs_settings") || "{}");
          } catch (_) {
            return {};
          }
        })();

        const storeName = settings.storeName || "Krishna G.C.";
        document.getElementById("gsStartupTitle").textContent = storeName;

        await new Promise(resolve => setTimeout(resolve, 1500));

        const config = readConfig();

        if (!config || !config.enabled || !config.hash || !config.salt) {
          showPinScreen(true);
        } else {
          showPinScreen(false);
        }
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorText.textContent = "";

        if (Date.now() < lockedUntil) {
          errorText.textContent =
            "धेरै पटक प्रयास भयो। केही समयपछि प्रयास गर्नुहोस्।";
          return;
        }

        const pin = input.value.trim();

        if (!validPin(pin)) {
          errorText.textContent = "४–८ अंकको नम्बर मात्र राख्नुहोस्।";
          input.focus();
          return;
        }

        try {
          if (mode === "setup") {
            const confirmation = confirmInput.value.trim();

            if (!validPin(confirmation)) {
              errorText.textContent = "पुष्टिका लागि पनि ४–८ अंक राख्नुहोस्।";
              confirmInput.focus();
              return;
            }

            if (pin !== confirmation) {
              errorText.textContent = "दुवै MPIN मिलेनन्। फेरि राख्नुहोस्।";
              confirmInput.value = "";
              confirmInput.focus();
              return;
            }

            const salt = makeSalt();
            const hash = await hashPin(pin, salt);

            localStorage.setItem(MPIN_KEY, JSON.stringify({
              enabled: true,
              salt: salt,
              hash: hash,
              createdAt: new Date().toISOString(),
              version: 1
            }));

            enterDashboard();
            return;
          }

          const config = readConfig();

          if (await verifyPin(pin, config)) {
            failures = 0;
            enterDashboard();
          } else {
            failures++;
            input.value = "";

            if (failures >= 5) {
              failures = 0;
              lockedUntil = Date.now() + 60000;
              errorText.textContent =
                "५ पटक गलत भयो। १ मिनेटपछि फेरि प्रयास गर्नुहोस्।";
            } else {
              errorText.textContent = "गलत MPIN। फेरि प्रयास गर्नुहोस्।";
            }

            input.focus();
          }
        } catch (error) {
          console.error("MPIN प्रक्रिया असफल:", error);
          errorText.error = error.message ||
            "MPIN प्रक्रिया पूरा भएन। HTTPS जाँच गर्नुहोस्।";
        }
      });

      initializeGate();
    })();

    /* Service worker */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(function (error) {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>

  <script src="./dashboard.js"></script>
</body>
